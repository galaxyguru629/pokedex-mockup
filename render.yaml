services:
  - type: web
    name: pokedex-mockup-server
    runtime: node
    plan: free
    buildCommand: npm install && npm run build && npm run db:migrate:deploy
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        value: "*"
